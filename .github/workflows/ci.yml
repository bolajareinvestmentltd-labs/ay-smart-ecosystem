name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django tests
        working-directory: core-backend
        run: |
          # Run unit tests
          python manage.py test core_api.tests
          # Run email smoke test using in-memory backend
          EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend python manage.py test_email_flow

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install frontend deps
        working-directory: apps/real-estate-web
        run: npm ci
      - name: Build frontend
        working-directory: apps/real-estate-web
        run: npm run build
      - name: Run smoke tests
        working-directory: apps/real-estate-web
        run: npm run smoke
      - name: Install Playwright browsers
        working-directory: apps/real-estate-web
        run: npx playwright install --with-deps
      - name: Run Playwright E2E
        working-directory: apps/real-estate-web
        run: npx playwright test --reporter=dot
